[project]
name = "ireports-domain"
version = "0.1.0"
description = "Versioned data contracts for asap-ireports, as Pydantic v2 models"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ireports_domain"]
