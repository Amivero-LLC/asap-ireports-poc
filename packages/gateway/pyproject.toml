[project]
name = "ireports-gateway"
version = "0.1.0"
description = "The only component permitted to call a model. Two adapters, one port."
requires-python = ">=3.12"
dependencies = [
    "ireports-domain",
    "anthropic[bedrock]>=0.121.0",
    # The embedding route is OpenAI-shaped and the Anthropic SDK has no embedding surface.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ireports_gateway"]

[tool.uv.sources]
ireports-domain = { workspace = true }
