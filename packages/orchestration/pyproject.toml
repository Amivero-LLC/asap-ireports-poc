[project]
name = "ireports-orchestration"
version = "0.1.0"
description = "Criteria selection, specialists, synthesis, and two orchestrators behind one port"
requires-python = ">=3.12"
dependencies = [
    "ireports-domain",
    "ireports-gateway",
    "ireports-retrieval",
]

[project.optional-dependencies]
# **There is no orchestration-framework extra, and that is the point (ADR-029).** This package
# depends on the standard library, `pydantic`, and the two sibling ports. No LangChain, no
# LangGraph, and therefore no `langsmith` — which is a mandatory transitive dependency of
# `langchain-core` and is a client capable of exporting run content out of a system that will
# carry CUI. Absence is a stronger guarantee than a configuration pin, and
# `tests/architecture/test_no_orchestration_framework.py` asserts it.
#
# The durable call store and node checkpoint (ORCH-02). Optional because a deployment that only
# needs within-run deduplication can use the in-memory stores and carry no driver.
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ireports_orchestration"]

[tool.uv.sources]
ireports-domain = { workspace = true }
ireports-gateway = { workspace = true }
ireports-retrieval = { workspace = true }
