[project]
name = "ireports-orchestration"
version = "0.1.0"
description = "Criteria selection, specialists, synthesis, and two orchestrators behind one port"
requires-python = ">=3.12"
dependencies = [
    "ireports-domain",
    "ireports-gateway",
    "ireports-retrieval",
]

[project.optional-dependencies]
# LangGraph is an *adapter's* dependency, not the package's (ADR-024). `langgraph_adapter.py`
# imports it inside `run()` so that a deployment built without this extra can still import the
# package and run the hand-rolled path — which is what "the framework is one adapter behind a
# port" has to mean when you try to package it. `spikes/lambda_demo/build.py` builds exactly that
# split: the `handrolled` Lambda package contains no LangGraph at all.
langgraph = ["langgraph>=1.2.10,<1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ireports_orchestration"]

[tool.uv.sources]
ireports-domain = { workspace = true }
ireports-gateway = { workspace = true }
ireports-retrieval = { workspace = true }
