[project]
name = "spike-handrolled"
version = "0.1.0"
description = "Bake-off candidate: a bounded, checkpointed state machine over PostgreSQL, no framework"
requires-python = ">=3.12"
dependencies = [
    "ireports-domain",
    "ireports-spike-harness",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike_handrolled"]

[tool.uv.sources]
ireports-domain = { workspace = true }
ireports-spike-harness = { workspace = true }
