[project]
name = "lambda-demo"
version = "0.1.0"
description = "Runnable local demo: one synthetic case through both orchestrators, real model calls"
requires-python = ">=3.12"
dependencies = ["ireports-domain", "ireports-gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lambda_demo"]
