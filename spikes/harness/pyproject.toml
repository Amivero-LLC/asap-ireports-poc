[project]
name = "ireports-spike-harness"
version = "0.1.0"
description = "Shared, framework-neutral substrate for the Milestone 1c orchestration bake-off"
requires-python = ">=3.12"
dependencies = [
    "ireports-domain",
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ireports_spike_harness"]

[tool.uv.sources]
ireports-domain = { workspace = true }
